[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perceiver"
version = "0.1.0"
description = "Perceiver-style models and training scripts (CIFAR, tabular benchmarks)"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "datasets>=2.14",
    "modal>=0.64",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "torchvision>=0.15",
    "wandb>=0.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tabular_encoder*"]

[tool.setuptools]
py-modules = ["lamb", "model", "project_env"]
